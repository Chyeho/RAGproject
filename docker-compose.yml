# ======================================================================
# 宸甄 PrivRAG — Docker Compose 编排文件
# ======================================================================
# 包含服务: nginx, frontend(Vue), backend(FastAPI), MySQL, Qdrant, Ollama
#
# 启动命令（开发环境）:
#   docker compose --env-file docker/env/.env.dev up -d --build
#
# 启动命令（生产环境）:
#   docker compose --env-file docker/env/.env.prod up -d --build
# ======================================================================

# ======================================================================
# 宿主机端口统一使用高位端口（backend 18000 / frontend 13000 / nginx 18080
# / MySQL 16666 / Qdrant 16333·16334 / Ollama 21434），降低与 Windows
# 保留段及常用服务冲突的概率。容器内部端口保持不变。
# ======================================================================

services:
  # ======================== MySQL 关系型数据库 ========================
  mysql:
    image: mysql:8.4
    container_name: privrag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-16666}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/middleware/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - privrag-network

  # ======================== Qdrant 向量数据库 ========================
  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: privrag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HOST_PORT:-16333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-16334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./docker/middleware/qdrant_config.yaml:/qdrant/config/config.yaml:ro
    networks:
      - privrag-network

  # ======================== Ollama 本地模型服务（MODEL_MODE=local 时使用） ========================
  ollama:
    image: ollama/ollama:latest
    container_name: privrag-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-21434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - privrag-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ======================== FastAPI 后端服务 ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privrag-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-privrag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-privrag}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-privrag}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      MODEL_MODE: ${MODEL_MODE:-remote}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # ---------- 账号管理：JWT 密钥 / 内置管理员 / 登录安全 ----------
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN1_USERNAME: ${ADMIN1_USERNAME:-}
      ADMIN1_PASSWORD: ${ADMIN1_PASSWORD:-}
      ADMIN2_USERNAME: ${ADMIN2_USERNAME:-}
      ADMIN2_PASSWORD: ${ADMIN2_PASSWORD:-}
      ADMIN3_USERNAME: ${ADMIN3_USERNAME:-}
      ADMIN3_PASSWORD: ${ADMIN3_PASSWORD:-}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
    ports:
      - "18000:18000"
    volumes:
      # 业务配置目录（只读挂载）
      - ./backend/app/config:/app/app/config:ro
      # 知识库数据
      - ./backend/app/data:/app/app/data
      # 持久化目录
      - chat_history:/app/chat_history
    networks:
      - privrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/docs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ======================== Vue 前端服务 ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: privrag-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "13000:80"
    networks:
      - privrag-network
    healthcheck:
      # 容器内 nginx 仅监听 IPv4，localhost 会解析为 IPv6 导致误判，显式用 127.0.0.1
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ======================== Nginx 反向代理 ========================
  nginx:
    image: nginx:stable-alpine
    container_name: privrag-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - privrag-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# ======================== 数据卷 ========================
volumes:
  mysql_data:
    name: privrag_mysql_data
  qdrant_data:
    name: privrag_qdrant_data
  ollama_data:
    name: privrag_ollama_data
  chat_history:
    name: privrag_chat_history

# ======================== 网络 ========================
networks:
  privrag-network:
    name: privrag-network
    driver: bridge

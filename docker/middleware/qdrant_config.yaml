# 仅做占位说明：Qdrant 主配置由容器内 /qdrant/config/config.yaml 管理
# 本文件供运维参考，实际部署时挂载到容器内对应路径

log_level: INFO

service:
  # Qdrant REST API 端口
  http_port: 6333
  # gRPC 端口
  grpc_port: 6334

storage:
  # 存储根路径（容器内）
  storage_path: /qdrant/storage

  # WAL 配置
  wal:
    wal_capacity_mb: 32
    wal_segments_ahead: 0

  # 性能配置
  performance:
    max_search_threads: 0  # 0 = 自动按 CPU 核数分配
    max_optimization_threads: 1

# ============ 前端 Vue 应用 Nginx 配置（容器内） ============
# 仅托管 Vue 构建产物，作为独立服务被外部 nginx 反向代理
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # SPA history 路由：不存在对应文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

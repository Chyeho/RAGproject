[project]
name = "RAGproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "bcrypt>=5.0.0",
    "cryptography>=47.0.0",
    "dashscope>=1.25.17",
    "fastapi[standard]>=0.136.3",
    "jieba>=0.42.1",
    "langchain>=1.3.4",
    "langchain-community>=0.4.1",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-qdrant>=1.1.0",
    "openpyxl>=3.1.5",
    "protobuf==3.20.3",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "pymysql>=1.2.0",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.31",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy[asyncio]>=2.0.49",
    "sqlmodel>=0.0.38",
    "streamlit>=1.56.0",
]

[dependency-groups]
# 本地重排模型（可选）：uv sync --group local-rerank 安装；未安装时 rerank 自动降级/跳过
local-rerank = [
    "sentence-transformers>=3.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "chroma_db*", "chat_history*", "tests*", "logs*"]
